<svg xmlns="http://www.w3.org/2000/svg" class="dg anim" viewBox="0 0 600 440" role="img"><title>Batcave Cloud: a laptop and a phone send requests to a Flask server running in Termux on an Android tablet</title><style>.dg-ln{fill:none;stroke:var(--line,#1925aa);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}.dg-thin{stroke-width:.75;opacity:.55}.dg-dash{stroke-dasharray:4 5}.dg-fc{fill:var(--line,#1925aa)}.dg-box{fill:var(--plate,#e8e6e0);stroke:var(--line,#1925aa);stroke-width:1.25}.dg-t{font-family:var(--mono, ui-monospace, Menlo, monospace);font-size:13px;fill:var(--ink,#0b0b0b)}.dg-s{font-family:var(--mono, ui-monospace, Menlo, monospace);font-size:10px;letter-spacing:.05em;fill:var(--muted,#5f5d57)}.dg-m{text-anchor:middle}.dg-e{text-anchor:end}.dg-sweep{fill:var(--line,#1925aa);fill-opacity:.12}</style><defs><marker id="u-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-fc" d="M0 0 L10 5 L0 10 z"/></marker></defs><path class="dg-ln dg-thin" d="M8 18 H28 M18 8 V28 M572 18 H592 M582 8 V28 M8 422 H28 M18 412 V432 M572 422 H592 M582 412 V432"/><defs><path id="u-r1" d="M178 150 H318"/><path id="u-r2" d="M138 316 H318"/></defs><text class="dg-s" x="40" y="22">HOME NETWORK · PORT 5000</text><text class="dg-s" x="320" y="58">GALAXY TAB S6 LITE · TERMUX</text><rect class="dg-box" x="320" y="70" width="236" height="306" rx="18"/><rect class="dg-ln dg-thin" x="334" y="86" width="208" height="274" rx="4"/><circle class="dg-fc" cx="438" cy="78" r="2"/><text class="dg-s" x="346" y="112" style="font-size:9.5px;fill:var(--ink,#0b0b0b)" fill-opacity="0" xml:space="preserve">$ flask run -h 0.0.0.0<animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.08;0.94;1" dur="9s" repeatCount="indefinite"/></text><text class="dg-s" x="346" y="134" style="font-size:9.5px;fill:var(--ink,#0b0b0b)" fill-opacity="0" xml:space="preserve"> * Running on :5000<animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.18;0.94;1" dur="9s" repeatCount="indefinite"/></text><text class="dg-s" x="346" y="156" style="font-size:9.5px;fill:var(--ink,#0b0b0b)" fill-opacity="0" xml:space="preserve">GET  /files          200<animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.28;0.94;1" dur="9s" repeatCount="indefinite"/></text><text class="dg-s" x="346" y="178" style="font-size:9.5px;fill:var(--ink,#0b0b0b)" fill-opacity="0" xml:space="preserve">POST /upload         200<animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.38;0.94;1" dur="9s" repeatCount="indefinite"/></text><text class="dg-s" x="346" y="200" style="font-size:9.5px;fill:var(--ink,#0b0b0b)" fill-opacity="0" xml:space="preserve">GET  /../etc/passwd  403<animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.48;0.94;1" dur="9s" repeatCount="indefinite"/></text><text class="dg-s" x="346" y="222" style="font-size:9.5px;fill:var(--ink,#0b0b0b)" fill-opacity="0" xml:space="preserve">POST /delete  no csrf 400<animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.58;0.94;1" dur="9s" repeatCount="indefinite"/></text><text class="dg-s" x="346" y="244" style="font-size:9.5px;fill:var(--ink,#0b0b0b)" fill-opacity="0" xml:space="preserve">GET  /thumbs/42      200<animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.68;0.94;1" dur="9s" repeatCount="indefinite"/></text><path class="dg-ln dg-thin" d="M346 290 H530"/><text class="dg-s" x="346" y="310">SQLITE · 65 TESTS PASS</text><rect class="dg-box" x="60" y="110" width="118" height="76"/><path class="dg-ln" d="M48 196 H190 L178 186 H60 Z"/><text class="dg-s dg-m" x="119" y="152">LAPTOP</text><rect class="dg-box" x="88" y="272" width="50" height="92" rx="8"/><text class="dg-s dg-m" x="113" y="322">PHONE</text><path class="dg-ln dg-dash" d="M178 150 H318 M138 316 H318"/><rect x="-5" y="-3" width="10" height="6" class="dg-fc"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#u-r1"/></animateMotion></rect><rect x="-5" y="-3" width="10" height="6" class="dg-fc" style="opacity:.45"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#u-r1"/></animateMotion></rect><rect x="-5" y="-3" width="10" height="6" class="dg-fc"><animateMotion dur="2.4s" begin="-0.6s" repeatCount="indefinite"><mpath href="#u-r2"/></animateMotion></rect><rect x="-5" y="-3" width="10" height="6" class="dg-fc" style="opacity:.45"><animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#u-r2"/></animateMotion></rect><text class="dg-s" x="190" y="140">SESSION + CSRF</text><text class="dg-s" x="166" y="306">PATH SANDBOX</text><text class="dg-s" x="40" y="404">FLASK · SQLITE · RUNS 24/7 ON A REPURPOSED TABLET</text></svg>
