<svg xmlns="http://www.w3.org/2000/svg" class="dg anim" viewBox="0 0 600 440" role="img"><title>A shell forks cat, grep and wc and joins them with pipes so data flows from one to the next</title><style>.dg-ln{fill:none;stroke:var(--line,#1925aa);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}.dg-thin{stroke-width:.75;opacity:.55}.dg-dash{stroke-dasharray:4 5}.dg-fc{fill:var(--line,#1925aa)}.dg-box{fill:var(--plate,#e8e6e0);stroke:var(--line,#1925aa);stroke-width:1.25}.dg-t{font-family:var(--mono, ui-monospace, Menlo, monospace);font-size:13px;fill:var(--ink,#0b0b0b)}.dg-s{font-family:var(--mono, ui-monospace, Menlo, monospace);font-size:10px;letter-spacing:.05em;fill:var(--muted,#5f5d57)}.dg-m{text-anchor:middle}.dg-e{text-anchor:end}.dg-sweep{fill:var(--line,#1925aa);fill-opacity:.12}</style><defs><marker id="u-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-fc" d="M0 0 L10 5 L0 10 z"/></marker></defs><path class="dg-ln dg-thin" d="M8 18 H28 M18 8 V28 M572 18 H592 M582 8 V28 M8 422 H28 M18 412 V432 M572 422 H592 M582 412 V432"/><defs><path id="u-p1" d="M175 278 H235"/><path id="u-p2" d="M365 278 H425"/><path id="u-in" d="M300 78 V114"/><path id="u-out" d="M490 308 V354"/></defs><text class="dg-s" x="40" y="22">STDIN · TYPED AT THE PROMPT</text><rect class="dg-box" x="40" y="30" width="520" height="46"/><text class="dg-t" x="60" y="58">$ cat access.log | grep 404 | wc -l<tspan dx="4">_<animate attributeName="fill-opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan></text><path class="dg-ln" d="M300 76 V114" marker-end="url(#u-arr)"/><circle r="3" class="dg-fc"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#u-in"/></animateMotion></circle><rect class="dg-box" x="225" y="118" width="150" height="50"/><text class="dg-t dg-m" x="300" y="140">forgeshell</text><text class="dg-s dg-m" x="300" y="157">PID 4021 · PARENT</text><path class="dg-ln dg-dash" d="M300 168 V204 H110 V248 M300 204 V248 M300 204 H490 V248"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></path><circle cx="300" cy="204" r="3" class="dg-fc"/><text class="dg-s" x="316" y="196">FORK() + EXECVP() ×3</text><rect class="dg-box" x="45" y="250" width="130" height="56"/><text class="dg-t dg-m" x="110" y="274">cat</text><text class="dg-s dg-m" x="110" y="292">PID 4022</text><rect class="dg-box" x="235" y="250" width="130" height="56"/><text class="dg-t dg-m" x="300" y="274">grep</text><text class="dg-s dg-m" x="300" y="292">PID 4023</text><rect class="dg-box" x="425" y="250" width="130" height="56"/><text class="dg-t dg-m" x="490" y="274">wc</text><text class="dg-s dg-m" x="490" y="292">PID 4024</text><path class="dg-ln" d="M175 272 H235 M175 284 H235 M365 272 H425 M365 284 H425"/><text class="dg-s dg-m" x="205" y="263">PIPE</text><text class="dg-s dg-m" x="395" y="263">PIPE</text><rect x="-4" y="-2.5" width="8" height="5" class="dg-fc"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite"><mpath href="#u-p1"/></animateMotion></rect><rect x="-4" y="-2.5" width="8" height="5" class="dg-fc"><animateMotion dur="1.5s" begin="-0.5s" repeatCount="indefinite"><mpath href="#u-p1"/></animateMotion></rect><rect x="-4" y="-2.5" width="8" height="5" class="dg-fc"><animateMotion dur="1.5s" begin="-1s" repeatCount="indefinite"><mpath href="#u-p1"/></animateMotion></rect><rect x="-4" y="-2.5" width="8" height="5" class="dg-fc"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite"><mpath href="#u-p2"/></animateMotion></rect><rect x="-4" y="-2.5" width="8" height="5" class="dg-fc"><animateMotion dur="1.5s" begin="-0.5s" repeatCount="indefinite"><mpath href="#u-p2"/></animateMotion></rect><rect x="-4" y="-2.5" width="8" height="5" class="dg-fc"><animateMotion dur="1.5s" begin="-1s" repeatCount="indefinite"><mpath href="#u-p2"/></animateMotion></rect><path class="dg-ln" d="M490 306 V354" marker-end="url(#u-arr)"/><circle r="3" class="dg-fc"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.55;0.8;1" calcMode="linear"><mpath href="#u-out"/></animateMotion></circle><rect class="dg-box" x="425" y="358" width="130" height="48"/><text class="dg-s dg-m" x="490" y="377">STDOUT</text><text class="dg-t dg-m" x="490" y="397">37<animate attributeName="fill-opacity" values="0.25;0.25;1;1" keyTimes="0;0.78;0.82;1" dur="3s" repeatCount="indefinite"/></text><text class="dg-s" x="45" y="364">DUP2()</text><text class="dg-s" x="148" y="364">STDOUT → WRITE END</text><text class="dg-s" x="45" y="382">WAITPID()</text><text class="dg-s" x="148" y="382">REAPS ALL THREE</text><text class="dg-s" x="45" y="400">TCSETPGRP()</text><text class="dg-s" x="148" y="400">HANDS BACK THE TTY</text></svg>
