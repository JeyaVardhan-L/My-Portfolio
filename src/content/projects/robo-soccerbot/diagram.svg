<svg xmlns="http://www.w3.org/2000/svg" class="dg anim" viewBox="0 0 600 440" role="img"><title>Top view of the four-wheel robot: an Arduino drives two BTS7960 motor drivers from a 2.4 GHz radio receiver</title><style>.dg-ln{fill:none;stroke:var(--line,#1925aa);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}.dg-thin{stroke-width:.75;opacity:.55}.dg-dash{stroke-dasharray:4 5}.dg-fc{fill:var(--line,#1925aa)}.dg-box{fill:var(--plate,#e8e6e0);stroke:var(--line,#1925aa);stroke-width:1.25}.dg-t{font-family:var(--mono, ui-monospace, Menlo, monospace);font-size:13px;fill:var(--ink,#0b0b0b)}.dg-s{font-family:var(--mono, ui-monospace, Menlo, monospace);font-size:10px;letter-spacing:.05em;fill:var(--muted,#5f5d57)}.dg-m{text-anchor:middle}.dg-e{text-anchor:end}.dg-sweep{fill:var(--line,#1925aa);fill-opacity:.12}</style><defs><marker id="u-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-fc" d="M0 0 L10 5 L0 10 z"/></marker></defs><path class="dg-ln dg-thin" d="M8 18 H28 M18 8 V28 M572 18 H592 M582 8 V28 M8 422 H28 M18 412 V432 M572 422 H592 M582 412 V432"/><text class="dg-s" x="40" y="22">TOP VIEW · 4WD, DIFFERENTIAL STEERING</text><circle class="dg-ln" cx="300" cy="50" r="11"/><path class="dg-ln dg-thin dg-dash" d="M300 64 V86"/><text class="dg-s" x="318" y="54">BALL</text><rect class="dg-box" x="200" y="90" width="200" height="250"/><rect class="dg-box" x="168" y="100" width="28" height="72"/><path class="dg-ln" d="M182 104 V168" style="stroke-dasharray:3 6;stroke-width:8;opacity:.45"><animate attributeName="stroke-dashoffset" from="0" to="9" dur="0.5s" repeatCount="indefinite"/></path><rect class="dg-box" x="168" y="258" width="28" height="72"/><path class="dg-ln" d="M182 262 V326" style="stroke-dasharray:3 6;stroke-width:8;opacity:.45"><animate attributeName="stroke-dashoffset" from="0" to="9" dur="0.5s" repeatCount="indefinite"/></path><rect class="dg-box" x="404" y="100" width="28" heigh