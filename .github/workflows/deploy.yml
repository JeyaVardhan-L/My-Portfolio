name: Deploy site

# Each theme lives on its own branch: `main` and any `theme/<name>`.
# The repository variable LIVE_THEME names the branch that is live
# (empty means `main`).
#
# - Pushing to the live branch deploys it automatically.
# - Pushing to any other theme branch just saves it; nothing goes live.
# - To switch themes: Actions -> Deploy site -> Run workflow, and type the
#   branch name. Then set LIVE_THEME to that branch
#   (Settings -> Secrets and variables -> Actions -> Variables) so later
#   pushes to it keep deploying.

on:
  push:
    branches: [main, 'theme/**']
  workflow_dispatch:
    inputs:
      theme:
        description: 'Branch to put live (main, or theme/<name>)'
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.LIVE_THEME || 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.theme || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
